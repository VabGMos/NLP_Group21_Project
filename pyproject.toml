[project]
name = "nlp-group21-project"
version = "0.1.0"
description = "NLP Group 21 Project"
readme = "README.md"
authors = [
    { name = "Thomas Mandelz", email = "thomas.mandelz@student.uva.nl" }
]
requires-python = ">=3.11"
dependencies = [
    "baycomp>=1.0.3",
    "datasets>=4.5.0",
    "hydra-core>=1.3.8",
    "matplotlib>=3.11.2",
    "numpy>=2.0.2",
    "omegaconf>=2.3.1",
    "requests>=2.28.1",
    "sentence-transformers>=5.1.2",
    "tokenizers>=0.22.2",
    "torch>=2.8.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "wandb>=0.21.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
